<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ケンタのプロフィールサイト</title>
    <style>
        /* 💡 ここで全体の見た目（デザイン）を整えています */
        body { font-family: 'Helvetica Neue', Arial, sans-serif; background-color: #f4f7f6; color: #333; margin: 0; padding: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .card { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; max-width: 400px; width: 90%; }
        h1 { color: #2c3e50; font-size: 24px; margin-bottom: 5px; }
        .tag { display: inline-block; background: #3498db; color: white; padding: 3px 10px; border-radius: 20px; font-size: 12px; margin-bottom: 20px; }
        p { line-height: 1.6; color: #555; }
        .likes { text-align: left; background: #f9f9f9; padding: 15px; border-radius: 8px; margin-top: 20px; }
        .likes h3 { margin-top: 0; color: #2c3e50; }
        .likes ul { padding-left: 20px; margin: 0; }
    </style>
</head>
<body>

    <div class="card">
        <!-- ✍️ ここの文字をあなたの情報に書き換えてください -->Hello!
        <h1>ケンタ (Kenta)</h1>
        <div class="tag">Webデベロッパー（見習い）</div>
        
        <p>はじめまして！GitHub Pagesを使って自分のウェブサイトを開設しました。これから色々なことに挑戦していきます！</p>
        
        <div class="likes">
            <h3>❤️ 好きなこと・趣味</h3>
            <ul>
                <li>💻 プログラミングの勉強</li>
                <li>🎮 ゲーム</li>
                <li>☕ カフェ巡り</li>
            </ul>
        </div>
    </div>

</body>
</html>
